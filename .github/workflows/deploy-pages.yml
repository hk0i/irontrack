name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        # --ignore-scripts: postinstall runs scripts/vendor.mjs for the old
        # zero-build app's www/vendor/ — unused output in this pipeline now
        # that it deploys dist/, not www/.
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
        env:
          DEPLOY_BASE: /irontrack/
      - name: Add SPA fallback 404.html
        # GitHub Pages is static hosting with no server-side rewrites — a
        # deep-linked route (e.g. /irontrack/history/abc123) 404s unless
        # something serves the app shell for it. dist/index.html already has
        # absolute, base-prefixed asset URLs baked in at build time, so a
        # byte-for-byte copy works: GH Pages serves this body (as an HTTP
        # 404 status — harmless, browsers render the body regardless of
        # status on a top-level navigation) while leaving the address bar at
        # the real deep path, so vue-router boots and matches it correctly.
        run: cp dist/index.html dist/404.html
      - name: Upload dist/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
